apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: vts-dev
spec:
  provider:
    vault:
      server: "http://localhost:8200"
      path: "vts"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"