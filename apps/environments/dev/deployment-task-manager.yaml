apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  namespace: vts-dev
  labels:
    project: vts-app
    app: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        project: vts-app
        app: task-manager
    spec:
      containers:
        - name: task-manager-app
          image: krakv/task-manager:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 8080
          
          envFrom:
            - configMapRef:
                name: vts-backend-config
            - secretRef:
                name: vts-backend-secret