apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  namespace: vts-dev
  labels:
    project: vts-app
    app: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        project: vts-app
        app: task-manager
    spec:
      containers:
        - name: task-manager-app
          image: krakv/task-manager:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 8080
          
          envFrom:
            - configMapRef:
                name: vts-backend-config
          
          env:
            - name: GIGACHAT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: GIGACHAT_AUTH_TOKEN
            
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: TELEGRAM_BOT_TOKEN
            
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: vts-backend-config
                  key: CONNECTION_STRING

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: JWT_SECRET

            - name: YANDEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: YANDEX_CLIENT_ID

            - name: YANDEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: YANDEX_CLIENT_SECRET

            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: SMTP_USERNAME

            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: SMTP_PASSWORD

            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: SMTP_FROM

            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: FRONTEND_URL

            - name: ELASTIC_SEARCH_URI
              valueFrom:
                secretKeyRef:
                  name: vts-backend-secret
                  key: ELASTIC_SEARCH_URI