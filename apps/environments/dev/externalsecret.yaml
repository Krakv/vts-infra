apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vts-backend-secret-ref
  namespace: vts-dev
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: vts-backend-secret
    creationPolicy: Owner
  data:
    - secretKey: TelegramBot__AuthToken
      remoteRef:
        key: vts/dev
        property: TELEGRAM_BOT_TOKEN
    - secretKey: JwtSettings__Secret
      remoteRef:
        key: vts/dev
        property: JWT_SECRET
    - secretKey: YandexOAuth__ClientId
      remoteRef:
        key: vts/dev
        property: YANDEX_CLIENT_ID
    - secretKey: YandexOAuth__ClientSecret
      remoteRef:
        key: vts/dev
        property: YANDEX_CLIENT_SECRET
    - secretKey: Smtp__Username
      remoteRef:
        key: vts/dev
        property: SMTP_USERNAME
    - secretKey: Smtp__Password
      remoteRef:
        key: vts/dev
        property: SMTP_PASSWORD
    - secretKey: Smtp__From
      remoteRef:
        key: vts/dev
        property: SMTP_FROM
    - secretKey: Frontend__Url
      remoteRef:
        key: vts/dev
        property: FRONTEND_URL
    - secretKey: Serilog__WriteTo__1__Args__NodeUris
      remoteRef:
        key: vts/dev
        property: ELASTIC_SEARCH_URI